      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sudan_criminal_psychology_theme_v1');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0B131E');
          }
        } catch (e) {}
      })();
    </script>
